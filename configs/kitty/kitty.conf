# ═══════════════════════════════════════════════════════════════════════════
# Kitty
# ═══════════════════════════════════════════════════════════════════════════
# Ricelin's ghostty look ported onto kitty, with the useful bits of the
# previous setup's kitty.conf (cursor trail, font-size binds, search kitten)
# kept. Colours are not here: wallcolors.py rewrites kitty-colors.conf on
# every wallpaper change and signals kitty to reload, the same way it feeds
# ghostty-colors to ghostty.
# ═══════════════════════════════════════════════════════════════════════════

# ── Font ───────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12.0
# ghostty's adjust-cell-height = 8%
modify_font      cell_height 8%

# ── Window ─────────────────────────────────────────────────────────────────
# ghostty window-padding-x 14 / -y 12; kitty takes vertical then horizontal.
window_padding_width      12 14
hide_window_decorations   yes
confirm_os_window_close   0
background_opacity        0.85
# Lets `kitty @ set-background-opacity` work at runtime, and is required for
# opacity changes to apply without a restart.
dynamic_background_opacity yes

# ── Cursor ─────────────────────────────────────────────────────────────────
cursor_shape           block
cursor_blink_interval  0
cursor_trail           1
mouse_hide_wait        3.0

# ── Clipboard ──────────────────────────────────────────────────────────────
# Matches ghostty's copy-on-select = clipboard.
copy_on_select clipboard

# ctrl+v is deliberately NOT bound. Binding it makes the terminal swallow the
# keypress and paste the clipboard as text, which breaks pasting images into
# TUIs that read the clipboard themselves (Claude Code). Paste lives on
# ctrl+shift+v instead.
map ctrl+shift+v paste_from_clipboard
map ctrl+c       copy_or_interrupt

# ── Font size ──────────────────────────────────────────────────────────────
map ctrl+plus        change_font_size all +1
map ctrl+equal       change_font_size all +1
map ctrl+kp_add      change_font_size all +1
map ctrl+minus       change_font_size all -1
map ctrl+underscore  change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0           change_font_size all 0
map ctrl+kp_0        change_font_size all 0

# ── Scroll ─────────────────────────────────────────────────────────────────
map page_up   scroll_page_up
map page_down scroll_page_down

# ── Colours ────────────────────────────────────────────────────────────────
# Regenerated by ~/.config/hypr/scripts/wallcolors.py on every wallpaper
# change; kitty reloads it on SIGUSR1, which that script sends.
include ${HOME}/.cache/ricelin/kitty-colors.conf
